<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario expirado o no válido · Facultad de Odontología</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
</head>
<body class="bg-light">
  <!-- Página independiente: no usa la base de datos ni plantillas hijas, así
       sigue funcionando aunque el error venga de ellas. Sin estilos en línea (CSP). -->
  <main class="container text-center py-5">
    <p class="display-1 fw-bold text-secondary mb-0" aria-hidden="true">403</p>
    <h1 class="mb-3">Formulario expirado o no válido</h1>
    <p class="text-secondary mb-4">Por seguridad, el formulario ya no es válido (puede haber pasado mucho tiempo o la página se abrió en otra pestaña). Vuelve atrás, recarga la página e inténtalo de nuevo.</p>
    <a class="btn btn-primary" href="/">Volver al inicio</a>
  </main>
</body>
</html>
