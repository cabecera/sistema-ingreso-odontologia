# ============================================
# Pipeline CI/CD — YAML multi-stage.
# CI corre tests y construye la imagen Docker.
# CD (solo main) dispara el Deploy Hook de Render.
# La URL del hook NUNCA va en este archivo: es la
# variable secreta RENDER_DEPLOY_HOOK en Azure Pipelines.
# ============================================

trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-latest

# Valores NO secretos, solo para CI/tests.
variables:
  SECRET_KEY: "ci-not-a-production-secret-key"
  # DEBUG=True evita que SECURE_SSL_REDIRECT rompa el cliente de tests.
  DEBUG: "True"
  USE_SQLITE: "True"
  DB_NAME: "ci"
  DB_USER: "ci"
  DB_PASSWORD: "ci"

stages:
  - stage: CI
    displayName: "Integración continua"
    jobs:
      - job: BuildAndTest
        displayName: "Tests, SAST y build Docker"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.13"
            displayName: "Configurar Python 3.13"

          - script: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                build-essential default-libmysqlclient-dev pkg-config
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: "Instalar dependencias del sistema y del proyecto"

          - bash: |
              KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
              echo "##vso[task.setvariable variable=FIELD_ENCRYPTION_KEY]$KEY"
            displayName: "Generar FIELD_ENCRYPTION_KEY para tests"

          - script: python manage.py check
            displayName: "Verificar configuración de Django"

          - script: python manage.py test
            displayName: "Ejecutar pruebas de Django"

          - script: |
              pip install bandit pip-audit
              bandit -r core pacientes coordinacion estudiantes administracion seguridad -ll
            displayName: "Análisis SAST (Bandit)"

          - script: pip-audit -r requirements.txt
            displayName: "Auditoría de dependencias (pip-audit)"
            continueOnError: true

          - script: docker build -t odontologia:$(Build.BuildId) .
            displayName: "Construir imagen Docker"

  - stage: CD
    displayName: "Despliegue continuo"
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployRender
        displayName: "Disparar Deploy Hook de Render"
        environment: produccion
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
                  displayName: "Llamar Deploy Hook de Render"
                  env:
                    RENDER_DEPLOY_HOOK: $(RENDER_DEPLOY_HOOK)
